{{/*
Created only when moodle.admin.password is set in values.

Leaving it unset is the right choice anywhere the password shouldn't sit in a
values file — create the Secret out of band instead:

  kubectl create secret generic moodle-admin \
    -n <namespace> --from-literal=password='...'

Either way the Deployment reads it from a Secret, never from an env literal.
*/}}
{{- if .Values.moodle.admin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: moodle-admin
type: Opaque
stringData:
  password: {{ .Values.moodle.admin.password | quote }}
{{- end }}
