apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: moodle-data
  annotations:
    "helm.sh/resource-policy": keep
spec:
  {{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass | quote }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.moodle.storageMoodledata }}
