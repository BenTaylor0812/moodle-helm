apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle
spec:
  selector:
    matchLabels:
      app: moodle
  template:
    metadata:
      labels:
        app: moodle
    spec:
      containers:
        - name: moodle
          image: {{ .Values.moodle.image }}
          env:
            - name: SKIP_INSTALL
              value: {{ .Values.moodle.skipInstall | quote }}
            {{- include "moodle.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: moodle-config
          ports:
            - containerPort: {{ .Values.moodle.service.port }}
          # Moodle's code is in the image, so startup is just config.php plus,
          # on a fresh database, the schema install — which still takes minutes.
          # A startupProbe gives it room; Kubernetes holds the liveness probe
          # off until this succeeds, so the pod is not killed mid-install.
          startupProbe:
            httpGet:
              path: /
              port: {{ .Values.moodle.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.moodle.service.port }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.moodle.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: moodle-data
              mountPath: /var/www/moodledata
{{- if .Values.moodle.cron.enabled }}
        # Moodle requires admin/cli/cron.php to run every minute. Without it,
        # scheduled tasks, outbound email, forum digests, backups and completion
        # tracking silently never run while the site appears healthy.
        #
        # A sidecar rather than a CronJob, deliberately: moodledata is
        # ReadWriteOnce, so a separate pod can only mount it if the scheduler
        # happens to place it on the same node. A sidecar shares it by
        # construction, on any cluster.
        #
        # This runs the image's normal ENTRYPOINT with SKIP_INSTALL=true, so it
        # waits for the database and writes its own config.php — which it needs,
        # because containers in a pod share volumes but not filesystems, and
        # Moodle's code is in the image layer. Only `args` is overridden, so the
        # entrypoint then execs the cron loop instead of Apache.
        - name: cron
          image: {{ .Values.moodle.image }}
          args:
            - /bin/bash
            - -c
            - |
              echo "Moodle cron: running every {{ .Values.moodle.cron.intervalSeconds }}s"
              while true; do
                php /var/www/moodle/admin/cli/cron.php \
                  || echo "Moodle cron: run failed (expected while first install is in progress)"
                sleep {{ .Values.moodle.cron.intervalSeconds }}
              done
          env:
            - name: SKIP_INSTALL
              value: "true"
            {{- include "moodle.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: moodle-config
          volumeMounts:
            - name: moodle-data
              mountPath: /var/www/moodledata
{{- end }}
      volumes:
        - name: moodle-data
          persistentVolumeClaim:
            claimName: moodle-data
