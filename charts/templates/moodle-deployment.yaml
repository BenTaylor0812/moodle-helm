apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle
spec:
  selector:
    matchLabels:
      app: moodle
  template:
    metadata:
      labels:
        app: moodle
    spec:
      containers:
        - name: moodle
          image: {{ .Values.moodle.image }}
          env:
            {{- include "moodle.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: moodle-config
          ports:
            - containerPort: {{ .Values.moodle.service.port }}
          # First install copies ~400MB of Moodle onto the volume and builds the
          # database schema, which takes minutes. A startupProbe gives it room;
          # Kubernetes holds the liveness probe off until this succeeds, so the
          # pod is no longer killed mid-install.
          startupProbe:
            httpGet:
              path: /
              port: {{ .Values.moodle.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.moodle.service.port }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.moodle.service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: moodle-code
              mountPath: /var/www/moodle
            - name: moodle-data
              mountPath: /var/www/moodledata
{{- if .Values.moodle.cron.enabled }}
        # Moodle requires admin/cli/cron.php to run every minute. Without it,
        # scheduled tasks, outbound email, forum digests, backups and completion
        # tracking silently never run while the site appears healthy.
        #
        # A sidecar rather than a CronJob, deliberately: the code and data
        # volumes are ReadWriteOnce, so a separate pod can only mount them if
        # the scheduler happens to place it on the same node. A sidecar shares
        # them by construction, on any cluster.
        #
        # `command` overrides the image ENTRYPOINT, so this container never runs
        # the install logic — it only runs cron.
        - name: cron
          image: {{ .Values.moodle.image }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "Moodle cron: waiting for config.php..."
              while [ ! -f /var/www/moodle/config.php ]; do sleep 5; done
              echo "Moodle cron: running every {{ .Values.moodle.cron.intervalSeconds }}s"
              while true; do
                php /var/www/moodle/admin/cli/cron.php \
                  || echo "Moodle cron: run failed (expected while first install is in progress)"
                sleep {{ .Values.moodle.cron.intervalSeconds }}
              done
          env:
            {{- include "moodle.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: moodle-config
          volumeMounts:
            - name: moodle-code
              mountPath: /var/www/moodle
            - name: moodle-data
              mountPath: /var/www/moodledata
{{- end }}
      volumes:
        - name: moodle-code
          persistentVolumeClaim:
            claimName: moodle-code
        - name: moodle-data
          persistentVolumeClaim:
            claimName: moodle-data
