apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
spec:
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.mariadb.image }}
          # The official image takes server settings as arguments rather than
          # the MARIADB_CHARACTER_SET / MARIADB_COLLATE env vars Bitnami used.
          args:
            - --character-set-server={{ .Values.mariadb.charset }}
            - --collation-server={{ .Values.mariadb.collate }}
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moodle-db
                  key: rootPassword
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moodle-db
                  key: password
          ports:
            - containerPort: {{ .Values.mariadb.service.port }}
              name: mysql
          volumeMounts:
            # Official image data directory. Bitnami used /bitnami/mariadb.
            - name: mariadb-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: mariadb-data
