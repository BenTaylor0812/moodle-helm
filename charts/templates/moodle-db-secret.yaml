{{/*
Database credentials, shared by the MariaDB container and Moodle.

Created only when mariadb.password is set. Leave it unset anywhere the password
shouldn't live in a values file, and create the Secret out of band:

  kubectl create secret generic moodle-db -n <namespace> \
    --from-literal=password='...' \
    --from-literal=rootPassword='...'
*/}}
{{- if .Values.mariadb.password }}
apiVersion: v1
kind: Secret
metadata:
  name: moodle-db
type: Opaque
stringData:
  password: {{ .Values.mariadb.password | quote }}
  rootPassword: {{ .Values.mariadb.rootPassword | default .Values.mariadb.password | quote }}
{{- end }}
